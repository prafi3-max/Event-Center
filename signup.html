<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>EventCenter | Create Account</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            background: #f5f7fb;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .signup-container {
            width: 100%;
            max-width: 450px;
            background: white;
            padding: 45px 40px;
            border-radius: 18px;
            box-shadow: 0 10px 35px rgba(0, 0, 0, 0.12);
        }

        .logo {
            text-align: center;
            font-size: 38px;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .logo span {
            color: #2563eb;
        }

        .welcome {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
            font-size: 18px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-size: 16px;
            font-weight: bold;
            margin-bottom: 8px;
        }

        input {
            width: 100%;
            padding: 14px;
            border: 1px solid #d1d5db;
            border-radius: 10px;
            font-size: 16px;
            outline: none;
        }

        input:focus {
            border-color: #2563eb;
        }

        .signup-btn {
            width: 100%;
            padding: 15px;
            background: #2563eb;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 5px;
        }

        .signup-btn:hover {
            background: #1d4ed8;
        }

        .message {
            text-align: center;
            margin-top: 18px;
            min-height: 20px;
        }

        .login {
            text-align: center;
            margin-top: 25px;
            color: #666;
        }

        .login a {
            color: #2563eb;
            font-weight: bold;
            text-decoration: none;
        }

        .back-home {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: #2563eb;
            font-weight: bold;
            text-decoration: none;
        }

        @media (max-width: 500px) {
            .signup-container {
                margin: 20px;
                padding: 35px 25px;
            }

            .logo {
                font-size: 32px;
            }
        }
    </style>
</head>

<body>

    <div class="signup-container">

        <div class="logo">
            Event<span>Center</span>
        </div>

        <p class="welcome">
            Create your EventCenter account
        </p>

        <form id="signupForm">

            <div class="form-group">
                <label for="name">Full Name</label>

                <input type="text" id="name" placeholder="Enter your full name" required>
            </div>

            <div class="form-group">
                <label for="email">Email</label>

                <input type="email" id="email" placeholder="Enter your email" required>
            </div>

            <div class="form-group">
                <label for="password">Password</label>

                <input type="password" id="password" placeholder="Create a password" minlength="6" required>
            </div>

            <button type="submit" class="signup-btn">
                Create Account
            </button>

        </form>

        <p id="signupMessage" class="message"></p>

        <div class="login">
            Already have an account?
            <a href="auth.html">Login</a>
        </div>

        <a href="index.html" class="back-home">
            ← Back to Home
        </a>

    </div>

    <!-- Supabase library -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <!-- Your JavaScript -->
    <script src="script.js"></script>

</body>

</html>
